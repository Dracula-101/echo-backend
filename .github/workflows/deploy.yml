name: Deploy to GCP E2 VM

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # don't cancel mid-deploy; risk of half-applied state

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger remote deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            cd /opt/echo-backend
            git fetch --all --prune
            git checkout ${{ github.sha }}

            COMPOSE_FILES=( \
              -f infra/docker/docker-compose.yml \
              -f infra/docker/docker-compose.prod.yml \
              -f infra/docker/docker-compose.e2small.yml \
            )

            # Pre-build cleanup. Keeps the base images but drops dangling layers
            # and stale build cache from previous failed runs.
            docker container prune -f
            docker image prune -f
            docker builder prune -f
            df -h /var/lib/docker

            # BuildKit on; cache mounts in the Dockerfiles persist /go/pkg/mod
            # and /root/.cache/go-build between builds. After the first deploy,
            # subsequent rebuilds compile in seconds.
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Serial builds — parallel builds peak the 30 GB docker disk on
            # e2-small. Profile-gated services (location/media/presence)
            # are skipped automatically because we don't pass --profile full.
            COMPOSE_PARALLEL_LIMIT=1 docker compose "${COMPOSE_FILES[@]}" \
              --env-file .env build

            docker compose "${COMPOSE_FILES[@]}" --env-file .env \
              up -d --remove-orphans

            docker compose "${COMPOSE_FILES[@]}" ps

            # Trim aggressively post-deploy.
            docker image prune -f
            docker builder prune -f --keep-storage 2GB
