# =============================================================================
# Echo Backend — CI/CD pipeline.
#
# Stages (each fails fast for the whole run):
#   1. verify  — compose config, Caddyfile, bash syntax. Runs in seconds.
#   2. build   — matrix of all images (Go services + custom postgres).
#                Pushes to GHCR with :sha-<short> and :latest tags.
#                Two-tier cache: GHA (fast, evicts in 7d) + GHCR registry
#                (survives, mode=max writes intermediate stages).
#   3. scan    — Trivy CVE scan of app images (informational by default).
#   4. deploy  — SSH into the VM, run deploy/vm-deploy.sh <sha>.
#
# Trigger paths:
#   - push to main: full pipeline.
#   - workflow_dispatch with `sha`: skip build/scan, deploy only (rollback).
#   - workflow_dispatch without `sha`: full pipeline at HEAD.
# =============================================================================
name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "deploy/README.md"
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to deploy (omit to build+deploy HEAD; provide to rollback to a previous build)"
        required: false
        type: string
      profiles:
        description: "Compose profiles for the deploy step (space-separated)"
        required: false
        default: "caddy"
        type: string

# Build can fan out across branches; deploy must serialize against the VM.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NS: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write   # for cosign / OIDC if added later

jobs:
  # ===========================================================================
  # 1. Verify — fast static checks. Runs in ~20s.
  # ===========================================================================
  verify:
    if: github.event_name == 'push' || inputs.sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax (deploy + scripts)
        run: |
          set -e
          for f in deploy/*.sh infra/scripts/*.sh; do
            [ -f "$f" ] || continue
            echo "→ $f"
            bash -n "$f"
          done

      # The prod compose declares `env_file: .env.prod` on every service,
      # so `compose config` fails if the file isn't present even when
      # we pass --env-file pointing elsewhere. Stub it from the example.
      - name: Stub .env.prod from .env.prod.example
        run: cp .env.prod.example .env.prod

      - name: Compose config (prod)
        run: |
          docker compose \
            -f infra/docker/docker-compose.prod.yml \
            --env-file .env.prod.example \
            --profile caddy --profile full \
            config --quiet
          echo "OK — prod compose parses with all profiles"

      - name: Compose config (prod-local overlay)
        run: |
          docker compose \
            -f infra/docker/docker-compose.prod.yml \
            -f infra/docker/docker-compose.prod-local.yml \
            --env-file .env.prod.example \
            config --quiet
          echo "OK — prod-local overlay parses"

      - name: Caddyfile syntax
        env:
          # Real-domain mode is the only mode actually used in prod. The
          # Caddyfile references /etc/caddy/certs/{cert,key}.pem — generate
          # a throwaway self-signed pair so `caddy validate` can resolve them.
          DOMAIN: "echo-app.net"
        run: |
          mkdir -p ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout ci-certs/key.pem -out ci-certs/cert.pem \
            -days 1 -subj "/CN=ci-validation" >/dev/null 2>&1
          docker run --rm \
            -e DOMAIN \
            -v "$PWD/infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/ci-certs:/etc/caddy/certs:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Summary
        run: echo "::notice::All static checks passed."

  # ===========================================================================
  # 2. Build — fan out across services + postgres, push to GHCR.
  # ===========================================================================
  build:
    needs: [verify]
    if: github.event_name == 'push' || inputs.sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api-gateway
            target: production
          - service: auth-service
            target: production
          - service: user-service
            target: production
          - service: message-service
            target: production
          - service: ws-service
            target: production
          - service: media-service
            target: production
          - service: presence-service
            target: production
          - service: location-service
            target: production
            # GeoLite2 .mmdb files are gitignored — fetch from a community
            # mirror before docker build so the COPY in the Dockerfile finds
            # them. Switch to MaxMind's official URL + license key if their
            # TOS matters to you (see deploy/README.md).
            pre_build: geolite
          - service: postgres
            dockerfile: infra/docker/database/Dockerfile
            # No `target:` here — postgres image is single-stage. Empty
            # target on the next step skips the --target flag.

    steps:
      - uses: actions/checkout@v4

      - name: Lower-case image namespace
        id: ns
        run: echo "ns=$(echo '${{ env.IMAGE_NS }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          short=$(echo "${{ github.sha }}" | cut -c1-12)
          {
            echo "image=${{ steps.ns.outputs.ns }}/${{ matrix.service }}"
            echo "sha_tag=sha-${short}"
          } >> "$GITHUB_OUTPUT"

      - name: Pre-build — fetch GeoLite2 (location-service only)
        if: matrix.pre_build == 'geolite'
        run: |
          MIRROR="https://github.com/P3TERX/GeoLite.mmdb/raw/download"
          mkdir -p services/location-service/data
          for db in GeoLite2-ASN GeoLite2-City GeoLite2-Country; do
            echo "→ $db.mmdb"
            curl -sSL --fail --retry 3 --retry-delay 2 \
              -o "services/location-service/data/${db}.mmdb" \
              "${MIRROR}/${db}.mmdb"
          done
          ls -lh services/location-service/data/

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile || format('services/{0}/Dockerfile', matrix.service) }}
          # When matrix.target is unset (postgres), GHA evaluates this to
          # an empty string; the action skips the --target flag.
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.run_started_at }}
            com.echo.service=${{ matrix.service }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: |
            type=gha,scope=${{ matrix.service }},mode=max
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max
          provenance: false
          build-args: |
            VERSION=${{ github.sha }}

      - name: Summary
        run: |
          echo "### ${{ matrix.service }} :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`${{ steps.tags.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tags: \`${{ steps.tags.outputs.sha_tag }}\`, \`latest\`" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # 3. Scan — Trivy CVE scan. Non-blocking; flip exit-code to 1 to gate.
  # ===========================================================================
  scan:
    needs: [build]
    if: github.event_name == 'push' || inputs.sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - message-service
          - ws-service
    steps:
      - name: Lower-case image namespace
        id: ns
        run: echo "ns=$(echo '${{ env.IMAGE_NS }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute sha tag
        id: tag
        run: echo "sha_tag=sha-$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Trivy scan ${{ matrix.service }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.ns.outputs.ns }}/${{ matrix.service }}:${{ steps.tag.outputs.sha_tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # informational; flip to "1" once you triage baseline

  # ===========================================================================
  # 4. Deploy — SSH into the VM, run vm-deploy.sh.
  #    Runs after build succeeds OR after build is skipped (rollback path).
  # ===========================================================================
  deploy:
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve SHA & profiles
        id: meta
        run: |
          sha="${{ inputs.sha || github.sha }}"
          profiles="${{ inputs.profiles || 'caddy' }}"
          {
            echo "sha=$sha"
            echo "short=$(echo "$sha" | cut -c1-12)"
            echo "profiles=$profiles"
          } >> "$GITHUB_OUTPUT"

      - name: Pre-deploy summary
        run: |
          {
            echo "### Deploying"
            echo "- SHA: \`${{ steps.meta.outputs.sha }}\` (\`sha-${{ steps.meta.outputs.short }}\`)"
            echo "- Profiles: \`${{ steps.meta.outputs.profiles }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Decode the base64-encoded Firebase service account JSON from a
      # GH secret and write it to /opt/echo-backend/secrets/firebase-credentials.json.
      # auth-service mounts this into the container at /etc/firebase/credentials.json.
      #
      # To set the secret:
      #   openssl base64 -A -in firebase-credentials.json | pbcopy
      #   then paste into the FIREBASE_CREDENTIALS_JSON repo secret.
      - name: Sync Firebase credentials to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          FIREBASE_CREDENTIALS_B64: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          command_timeout: 2m
          envs: FIREBASE_CREDENTIALS_B64
          script: |
            set -euo pipefail
            if [ -z "${FIREBASE_CREDENTIALS_B64:-}" ]; then
              echo "::error::FIREBASE_CREDENTIALS_JSON secret is empty or missing"
              echo "  Add at: https://github.com/${{ github.repository }}/settings/secrets/actions"
              echo "  Value: openssl base64 -A -in firebase-credentials.json"
              exit 1
            fi
            mkdir -p /opt/echo-backend/secrets
            chmod 700 /opt/echo-backend/secrets
            printf '%s' "$FIREBASE_CREDENTIALS_B64" | base64 -d \
              > /opt/echo-backend/secrets/firebase-credentials.json
            chmod 600 /opt/echo-backend/secrets/firebase-credentials.json
            # Sanity-check: must be valid JSON with a private_key field.
            if ! grep -q '"private_key"' /opt/echo-backend/secrets/firebase-credentials.json; then
              echo "::error::Decoded Firebase credentials don't look like a service account JSON"
              exit 1
            fi
            echo "  firebase-credentials.json synced ($(wc -c < /opt/echo-backend/secrets/firebase-credentials.json) bytes)"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          command_timeout: 12m
          script_stop: true
          envs: SHA,PROFILES
          script: |
            set -euo pipefail
            export SHA='${{ steps.meta.outputs.sha }}'
            export PROFILES='${{ steps.meta.outputs.profiles }}'
            cd /opt/echo-backend
            bash deploy/vm-deploy.sh "$SHA"

      - name: Post-deploy health check (best effort)
        if: ${{ success() }}
        run: |
          echo "::notice::Deploy step succeeded. Stack should be healthy on the VM."
          echo "Run \`make vm-status\` on the box to verify."
