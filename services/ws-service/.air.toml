# ==============================
# Air - Go Development Config
# ==============================
root = "."
tmp_dir = "tmp"
testdata_dir = "testdata"

# ------------------------------
# Build settings
# ------------------------------
[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  include_dir = ["../../shared", "cmd", "configs", "internal", "api"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  include_file = [".env"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  delay = 2000
  kill_delay = "5s"
  log = "build-errors.log"
  pre_cmd = [
    "go mod edit -replace shared=../../shared",
    "go get shared",
    "go mod tidy"
  ]
  post_cmd = []
  rerun = true
  rerun_delay = 1500
  send_interrupt = true
  stop_on_error = false
  args_bin = []

# ------------------------------
# Color settings
# ------------------------------
[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

# ------------------------------
# Logging settings
# ------------------------------
[log]
  main_only = false
  time = false

# ------------------------------
# Miscellaneous
# ------------------------------
[misc]
  clean_on_exit = false

# ------------------------------
# Screen settings
# ------------------------------
[screen]
  clear_on_rebuild = false
  keep_scroll = true
