# =============================================================================
# Echo Backend — production compose.
#
# Used in two contexts:
#   1) On the deploy VM, applied as-is.
#   2) On a developer laptop, layered with docker-compose.prod-local.yml,
#      to mirror the prod stack before pushing.
#
# Image strategy: Go services use `image:` from GHCR. CI builds & pushes
# under :sha-<short> and :latest tags; the VM only pulls. The `build:`
# block stays so prod-local can rebuild locally with the SAME Dockerfile
# that produced the registry image.
#
# All sizing is driven by env vars with sensible defaults. To scale up,
# set RES_*_MEMORY / RES_*_CPUS in .env.prod (no compose edits needed).
#
# Required env (see .env.prod.example):
#   IMAGE_REGISTRY, IMAGE_TAG, POSTGRES_*, DB_*, REDIS_PASSWORD,
#   JWT_SECRET_KEY, KAFKA_BROKERS, DOMAIN.
#
# Profiles (opt-in):
#   --profile full        location/media/presence services.
#   --profile caddy       public HTTPS reverse proxy (always on in prod).
#   --profile monitoring  Prometheus + cAdvisor scrape targets.
# =============================================================================
name: echo-backend

# -----------------------------------------------------------------------------
# Shared YAML anchors
# -----------------------------------------------------------------------------
x-env-common: &env-common
  APP_ENV: production
  ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  SERVER_HOST: 0.0.0.0
  TZ: ${TZ:-UTC}

x-env-go-runtime: &env-go-runtime
  # GOMEMLIMIT pairs with the container memory limit below so the GC
  # gets back-pressure before the cgroup OOM-killer fires.
  GOMAXPROCS: ${GOMAXPROCS:-2}
  GOGC: ${GOGC:-100}
  GOMEMLIMIT: ${GOMEMLIMIT:-192MiB}

x-env-db: &env-db
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_NAME: ${POSTGRES_DB}
  DB_SSL_MODE: ${DB_SSL_MODE:-disable}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-15}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-3}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-300s}

x-env-redis: &env-redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

x-env-kafka: &env-kafka
  KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}

x-env-jwt: &env-jwt
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ISSUER: ${JWT_ISSUER:-echo-auth-service}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-echo-users}
  JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
  JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-168h}
  JWT_LEEWAY: ${JWT_LEEWAY:-1m}

x-env-cors: &env-cors
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
  CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}

x-env-app: &env-app
  <<: [*env-common, *env-go-runtime, *env-db, *env-redis, *env-jwt]

# Build context for Go services. Only triggered when --build is passed
# (i.e., the prod-local overlay). Real prod uses `image:` exclusively.
x-build-go: &build-go
  context: ${PWD}
  target: production

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 30s

# json-file driver caps each container's logs and tags them so a log
# shipper (Promtail / Vector / Fluent Bit) can route by service.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}
    tag: "{{.Name}}|{{.ImageName}}"
    labels: "com.echo.service,com.echo.tier"

# Hardening defaults applied to every service:
#   - no_new_privileges blocks setuid escalation
#   - cap_drop ALL strips every Linux capability the container starts with;
#     services re-add only what they need (none of ours need any).
#   - read_only roots the container FS read-only; writable areas are
#     opted in via tmpfs / named volumes per service.
x-security: &security
  security_opt:
    - "no-new-privileges:true"
  cap_drop: ["ALL"]
  read_only: true

x-service-base: &service-base
  restart: always
  networks: [echo-internal]
  logging: *logging
  <<: *security

# Resource budgets. Every limit is env-driven so you can right-size the
# stack for whatever VM you land on without editing compose.
x-res-go: &res-go
  resources:
    limits:
      cpus:   "${RES_GO_CPUS:-1.0}"
      memory: "${RES_GO_MEMORY:-256M}"
    reservations:
      cpus:   "${RES_GO_CPUS_RESERVED:-0.05}"
      memory: "${RES_GO_MEMORY_RESERVED:-64M}"

x-res-postgres: &res-postgres
  resources:
    limits:
      cpus:   "${RES_POSTGRES_CPUS:-2.0}"
      memory: "${RES_POSTGRES_MEMORY:-512M}"
    reservations:
      cpus:   "${RES_POSTGRES_CPUS_RESERVED:-0.25}"
      memory: "${RES_POSTGRES_MEMORY_RESERVED:-256M}"

x-res-redis: &res-redis
  resources:
    limits:
      cpus:   "${RES_REDIS_CPUS:-1.0}"
      memory: "${RES_REDIS_MEMORY:-256M}"
    reservations:
      cpus:   "${RES_REDIS_CPUS_RESERVED:-0.05}"
      memory: "${RES_REDIS_MEMORY_RESERVED:-64M}"

x-res-kafka: &res-kafka
  resources:
    limits:
      cpus:   "${RES_KAFKA_CPUS:-2.0}"
      memory: "${RES_KAFKA_MEMORY:-768M}"
    reservations:
      cpus:   "${RES_KAFKA_CPUS_RESERVED:-0.25}"
      memory: "${RES_KAFKA_MEMORY_RESERVED:-384M}"

x-res-zookeeper: &res-zookeeper
  resources:
    limits:
      cpus:   "${RES_ZOOKEEPER_CPUS:-0.5}"
      memory: "${RES_ZOOKEEPER_MEMORY:-256M}"
    reservations:
      cpus:   "${RES_ZOOKEEPER_CPUS_RESERVED:-0.05}"
      memory: "${RES_ZOOKEEPER_MEMORY_RESERVED:-128M}"

x-res-caddy: &res-caddy
  resources:
    limits:
      cpus:   "${RES_CADDY_CPUS:-0.5}"
      memory: "${RES_CADDY_MEMORY:-128M}"
    reservations:
      cpus:   "${RES_CADDY_CPUS_RESERVED:-0.05}"
      memory: "${RES_CADDY_MEMORY_RESERVED:-32M}"

x-depends-db: &depends-db
  postgres: { condition: service_healthy }
  redis:    { condition: service_healthy }
  migrate:  { condition: service_completed_successfully }

x-depends-full: &depends-full
  postgres: { condition: service_healthy }
  redis:    { condition: service_healthy }
  kafka:    { condition: service_healthy }
  migrate:  { condition: service_completed_successfully }

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  # Service-to-service bus. Caddy is the only path from the public internet.
  # `internal: false` because services need egress (DNS, ACME, S3, OAuth).
  echo-internal:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: echo0
      com.docker.network.bridge.enable_icc: "true"

# -----------------------------------------------------------------------------
# Volumes (named — survive recreates; backed up via backup-postgres.sh)
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    labels: { com.echo.backup: "critical" }
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  caddy_data:
  caddy_config:
  media_storage:
    labels: { com.echo.backup: "critical" }

# =============================================================================
# Services
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: always
    # NOTE: do NOT set read_only here. Postgres's docker-entrypoint script
    # writes to /var/lib/postgresql (parent of PGDATA) on init, and the
    # server itself touches several paths outside the data dir. We still
    # apply the rest of the hardening (cap_drop + no-new-privileges).
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /tmp
      - /run/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    # Settings tuned by env vars so a bigger box only needs a config update,
    # not a compose edit.
    command: >
      postgres
        -c shared_buffers=${PG_SHARED_BUFFERS:-128MB}
        -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-256MB}
        -c work_mem=${PG_WORK_MEM:-4MB}
        -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-32MB}
        -c max_connections=${PG_MAX_CONNECTIONS:-100}
        -c log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-500}
        -c log_lock_waits=on
        -c track_io_timing=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [echo-internal]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy: *res-postgres
    labels:
      com.echo.service: postgres
      com.echo.tier: data

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    <<: *security
    read_only: true
    tmpfs: [/tmp]
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
        --maxmemory ${REDIS_MAX_MEMORY:-256mb}
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --tcp-keepalive 300
        --protected-mode yes
        --io-threads 2
    volumes:
      - redis_data:/data
    networks: [echo-internal]
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy: *res-redis
    labels:
      com.echo.service: redis
      com.echo.tier: cache

  # ---------------------------------------------------------------------------
  # Zookeeper + Kafka
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "${ZK_HEAP_OPTS:--Xmx128m -Xms96m}"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks: [echo-internal]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy: *res-zookeeper
    labels:
      com.echo.service: zookeeper
      com.echo.tier: messaging

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      zookeeper: { condition: service_healthy }
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,CONTROLLER://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-8}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-72}
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xmx384m -Xms256m}"
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [echo-internal]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 45s
    deploy: *res-kafka
    labels:
      com.echo.service: kafka
      com.echo.tier: messaging

  # ---------------------------------------------------------------------------
  # One-shot DB migrations.
  #
  # Applies database/migrations/*.sql in filename order on every deploy.
  # These files MUST be idempotent — re-running is the contract.
  #
  # Initial schema (database/schemas/, functions/, indexes/, etc.) is NOT
  # applied here — those files use bare CREATE TABLE and would fail on the
  # second deploy. Bootstrap a fresh Postgres once with:
  #
  #   docker compose ... exec -T postgres psql -U $POSTGRES_USER \
  #     -d $POSTGRES_DB < db-dump.sql
  #
  # App services depend on this with `service_completed_successfully`, so
  # a migration failure aborts the deploy.
  # ---------------------------------------------------------------------------
  migrate:
    image: postgres:15-alpine
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ${PWD}/database/migrations:/migrations:ro
    networks: [echo-internal]
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        count=0
        for f in $$(ls /migrations/*.sql 2>/dev/null | sort); do
          echo "[migrate] applying $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
          count=$$((count+1))
        done
        echo "[migrate] applied $$count migration(s)"

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  api-gateway:
    <<: *service-base
    image: ${IMAGE_REGISTRY}/api-gateway:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    build: { <<: *build-go, dockerfile: services/api-gateway/Dockerfile }
    expose: ["8080"]
    tmpfs: [/tmp]
    environment:
      <<: [*env-app, *env-cors]
      SERVER_PORT: 8080
      AUTH_SERVICE_URL:     http://auth-service:8081
      USER_SERVICE_URL:     http://user-service:8082
      MESSAGE_SERVICE_URL:  http://message-service:8083
      MEDIA_SERVICE_URL:    http://media-service:8085
      PRESENCE_SERVICE_URL: http://presence-service:8084
      LOCATION_SERVICE_URL: http://location-service:8090
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_RPM:   ${RATE_LIMIT_RPM:-6000}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://localhost:8080/health"]
    deploy: *res-go
    labels:
      com.echo.service: api-gateway
      com.echo.tier: edge

  auth-service:
    <<: *service-base
    image: ${IMAGE_REGISTRY}/auth-service:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    build: { <<: *build-go, dockerfile: services/auth-service/Dockerfile }
    expose: ["8081"]
    tmpfs: [/tmp]
    environment:
      <<: *env-app
      SERVER_PORT: 8081
      REDIS_DB: 0
      LOCATION_SERVICE_URL: http://location-service:8090
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://localhost:8081/health"]
    deploy: *res-go
    labels:
      com.echo.service: auth-service
      com.echo.tier: app

  user-service:
    <<: *service-base
    image: ${IMAGE_REGISTRY}/user-service:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    build: { <<: *build-go, dockerfile: services/user-service/Dockerfile }
    expose: ["8082"]
    tmpfs: [/tmp]
    environment:
      <<: *env-app
      SERVER_PORT: 8082
      REDIS_DB: 2
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://localhost:8082/health"]
    deploy: *res-go
    labels:
      com.echo.service: user-service
      com.echo.tier: app

  message-service:
    <<: *service-base
    image: ${IMAGE_REGISTRY}/message-service:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    build: { <<: *build-go, dockerfile: services/message-service/Dockerfile }
    expose: ["8083"]
    tmpfs: [/tmp]
    environment:
      <<: [*env-app, *env-kafka]
      SERVER_PORT: 8083
      REDIS_DB: 1
      KAFKA_TOPIC: messages
      KAFKA_GROUP_ID: message-service-prod
    depends_on: *depends-full
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://localhost:8083/health"]
    deploy: *res-go
    labels:
      com.echo.service: message-service
      com.echo.tier: app

  ws-service:
    <<: *service-base
    image: ${IMAGE_REGISTRY}/ws-service:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    build: { <<: *build-go, dockerfile: services/ws-service/Dockerfile }
    expose: ["8086"]
    tmpfs: [/tmp]
    environment:
      <<: [*env-app, *env-kafka]
      SERVER_PORT: 8086
      REDIS_DB: 5
      KAFKA_TOPIC: chat-messages
      KAFKA_GROUP_ID: ws-delivery-group
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-*}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-2000}
    depends_on: *depends-full
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://localhost:8086/health"]
    deploy: *res-go
    labels:
      com.echo.service: ws-service
      com.echo.tier: app

  # ---------------------------------------------------------------------------
  # Optional / heavier services — enable with `--profile full`.
  # ---------------------------------------------------------------------------
  location-service:
    profiles: ["full"]
    <<: *service-base
    image: ${IMAGE_REGISTRY}/location-service:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    build: { <<: *build-go, dockerfile: services/location-service/Dockerfile }
    expose: ["8090"]
    tmpfs: [/tmp]
    environment:
      <<: [*env-common, *env-go-runtime]
      SERVER_PORT: 8090
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://localhost:8090/health"]
    deploy: *res-go
    labels:
      com.echo.service: location-service
      com.echo.tier: app

  media-service:
    profiles: ["full"]
    <<: *service-base
    image: ${IMAGE_REGISTRY}/media-service:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    build: { <<: *build-go, dockerfile: services/media-service/Dockerfile }
    expose: ["8085"]
    # media-service writes uploaded files; keep the FS otherwise read-only.
    read_only: false
    environment:
      <<: *env-app
      SERVER_PORT: 8085
      REDIS_DB: 3
      STORAGE_PROVIDER:           ${STORAGE_PROVIDER:-s3}
      STORAGE_BUCKET:             ${STORAGE_BUCKET}
      STORAGE_REGION:             ${STORAGE_REGION}
      STORAGE_ACCESS_KEY_ID:      ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY:  ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_ENDPOINT:           ${STORAGE_ENDPOINT}
      STORAGE_PUBLIC_URL:         ${STORAGE_PUBLIC_URL}
    volumes:
      - media_storage:/app/media
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://localhost:8085/health"]
    deploy: *res-go
    labels:
      com.echo.service: media-service
      com.echo.tier: app

  presence-service:
    profiles: ["full"]
    <<: *service-base
    image: ${IMAGE_REGISTRY}/presence-service:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-always}
    build: { <<: *build-go, dockerfile: services/presence-service/Dockerfile }
    expose: ["8084"]
    tmpfs: [/tmp]
    environment:
      <<: *env-app
      SERVER_PORT: 8084
      REDIS_DB: 4
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://localhost:8084/health"]
    deploy: *res-go
    labels:
      com.echo.service: presence-service
      com.echo.tier: app

  # ---------------------------------------------------------------------------
  # Caddy — public HTTPS reverse proxy.
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Caddy needs CAP_NET_BIND_SERVICE to bind 80/443 as non-root.
    cap_add: ["NET_BIND_SERVICE"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ${PWD}/infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Origin certs (Cloudflare Origin Cert or any PEM pair).
      # If the secrets dir is empty, Caddy falls back to ACME via Let's
      # Encrypt — see the Caddyfile for the conditional.
      - ${PWD}/secrets:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [echo-internal]
    logging: *logging
    depends_on:
      api-gateway: { condition: service_healthy }
      ws-service:  { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy: *res-caddy
    labels:
      com.echo.service: caddy
      com.echo.tier: edge