# Echo Backend - Production Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: echo-backend-prod

# =============================================================================
# EXTENSION FIELDS (Shared Configuration)
# =============================================================================

# Environment Variable Groups
x-env-common: &env-common
  APP_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json

x-env-performance: &env-performance
  GOMAXPROCS: 4
  GOGC: 100
  GOMEMLIMIT: 800MiB

x-env-performance-small: &env-performance-small
  GOMAXPROCS: 2
  GOGC: 100
  GOMEMLIMIT: 400MiB

x-env-monitoring: &env-monitoring
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  JAEGER_ENDPOINT: http://jaeger:14268/api/traces

x-env-db: &env-db
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_NAME: ${POSTGRES_DB}
  DB_SSLMODE: require
  DB_MAX_OPEN_CONNS: 25
  DB_MAX_IDLE_CONNS: 5

x-env-redis: &env-redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

x-env-kafka: &env-kafka
  KAFKA_BROKERS: kafka:29092

# Combined environment for standard services
x-env-full: &env-full
  <<: [ *env-common, *env-performance, *env-monitoring, *env-db, *env-redis ]
  SERVER_HOST: 0.0.0.0

# Build Configuration
x-build-base: &build-base
  context: ${PWD}
  target: production
  args:
    BUILD_ENV: production
    VERSION: ${VERSION:-latest}

# Deploy Configurations
x-deploy-standard: &deploy-standard
  mode: replicated
  replicas: 2
  update_config:
    parallelism: 1
    delay: 10s
    failure_action: rollback
    monitor: 60s
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 3

x-resources-standard: &resources-standard
  limits: { cpus: '2.0', memory: 1G }
  reservations: { cpus: '0.5', memory: 256M }

x-resources-small: &resources-small
  limits: { cpus: '1.0', memory: 512M }
  reservations: { cpus: '0.25', memory: 128M }

x-resources-large: &resources-large
  limits: { cpus: '2.0', memory: 2G }
  reservations: { cpus: '1.0', memory: 512M }

# Healthcheck Configurations
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

# Logging Configurations
x-logging: &logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"
    labels: "service,tier,version"

x-logging-small: &logging-small
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"
    labels: "service,tier"

# Base Service Template
x-service-base: &service-base
  restart: always
  networks: [ echo-internal ]
  logging: *logging

# Dependencies
x-depends-db: &depends-db
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }

x-depends-full: &depends-full
  <<: *depends-db
  kafka: { condition: service_healthy }

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  echo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-echo
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

  echo-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  api-gateway-logs:
  auth-service-logs:
  message-service-logs:
  user-service-logs:
  location-service-logs:
  media-service-logs:
  presence-service-logs:
  media-storage:
    labels:
      com.echo.backup: "critical"

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: echo-postgres-prod
    restart: always
    ports: [ "127.0.0.1:5432:5432" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    command: |
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=1310kB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c max_worker_processes=8
        -c max_parallel_workers_per_gather=4
        -c max_parallel_workers=8
        -c max_parallel_maintenance_workers=4
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./certs/postgres:/var/lib/postgresql:ro
    networks: [ echo-internal ]
    logging: *logging-small
    deploy:
      resources: *resources-large
    labels: { com.echo.service: postgres, com.echo.tier: database, com.echo.critical: "true" }

  redis:
    image: redis:7-alpine
    container_name: echo-redis-prod
    restart: always
    ports: [ "127.0.0.1:6379:6379" ]
    command: |
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 1gb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --save 60 10000
        --tcp-backlog 511
        --tcp-keepalive 300
        --timeout 0
        --databases 16
        --stop-writes-on-bgsave-error yes
        --rdbcompression yes
        --rdbchecksum yes
        --dir /data
        --loglevel notice
        --protected-mode yes
    volumes:
      - redis_data:/data
    networks: [ echo-internal ]
    logging: *logging-small
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }
        reservations: { cpus: '0.5', memory: 256M }
    labels: { com.echo.service: redis, com.echo.tier: cache, com.echo.critical: "true" }

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: echo-kafka-prod
    restart: always
    ports: [ "127.0.0.1:9092:9092" ]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_COMPRESSION_TYPE: lz4
      # Prod: 3 brokers expected; min-ISR=2 means writes survive a single-broker failure.
      # Auto-create disabled — topics provisioned via `make kafka-create-topics`.
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 64
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    networks: [ echo-internal ]
    depends_on:
      zookeeper: { condition: service_healthy }
    logging: *logging-small
    deploy:
      resources: *resources-large
    labels: { com.echo.service: kafka, com.echo.tier: messaging, com.echo.critical: "true" }

  # ---------------------------------------------------------------------------
  # API Gateway (Public)
  # ---------------------------------------------------------------------------
  api-gateway:
    <<: *service-base
    build:
      <<: *build-base
      dockerfile: services/api-gateway/Dockerfile
    # container_name removed - incompatible with deploy.replicas
    image: echo/api-gateway:${VERSION:-latest}
    ports: [ "8080:8080" ]
    networks: [ echo-network, echo-internal ]
    environment:
      <<: *env-full
      SERVER_PORT: 8080
      CONFIG_PATH: /app/configs/config.yaml
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      MESSAGE_SERVICE_URL: http://message-service:8083
      MEDIA_SERVICE_URL: http://media-service:8085
      PRESENCE_SERVICE_URL: http://presence-service:8084
      ENABLE_CORS: ${ENABLE_CORS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENABLE_RATE_LIMIT: "true"
      RATE_LIMIT_RPS: 100
      RATE_LIMIT_BURST: 200
    volumes:
      - api-gateway-logs:/var/log/api-gateway
      - ./certs/api:/app/certs:ro
    depends_on: [ auth-service, message-service, user-service ]
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
    deploy:
      <<: *deploy-standard
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources: *resources-standard
    labels: { com.echo.service: api-gateway, com.echo.tier: application, com.echo.version: "${VERSION:-latest}", com.echo.critical: "true" }

  # ---------------------------------------------------------------------------
  # Auth Service
  # ---------------------------------------------------------------------------
  auth-service:
    <<: *service-base
    build:
      <<: *build-base
      dockerfile: services/auth-service/Dockerfile
    # container_name removed - incompatible with deploy.replicas
    image: echo/auth-service:${VERSION:-latest}
    expose: [ "8081" ]
    environment:
      <<: *env-full
      SERVER_PORT: 8081
      CONFIG_PATH: /app/configs/config.yaml
      REDIS_DB: 0
      REDIS_MAX_RETRIES: 3
      REDIS_POOL_SIZE: 10
      REDIS_MIN_IDLE_CONNS: 5
      DB_CONN_MAX_LIFETIME: 300s
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-168h}
      BCRYPT_COST: 12
      LOCATION_SERVICE_URL: http://location-service:8090
    volumes:
      - auth-service-logs:/var/log/auth-service
      - ./certs/auth:/app/certs:ro
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health" ]
    deploy:
      <<: *deploy-standard
      resources: *resources-standard
    labels: { com.echo.service: auth-service, com.echo.tier: application, com.echo.version: "${VERSION:-latest}", com.echo.critical: "true" }

  # ---------------------------------------------------------------------------
  # User Service
  # ---------------------------------------------------------------------------
  user-service:
    <<: *service-base
    build:
      <<: *build-base
      dockerfile: services/user-service/Dockerfile
    # container_name removed - incompatible with deploy.replicas
    image: echo/user-service:${VERSION:-latest}
    expose: [ "8082" ]
    environment:
      <<: *env-full
      SERVER_PORT: 8082
      CONFIG_PATH: /app/configs/config.yaml
      REDIS_DB: 2
    volumes:
      - user-service-logs:/var/log/user-service
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health" ]
    deploy:
      <<: *deploy-standard
      resources: *resources-standard
    labels: { com.echo.service: user-service, com.echo.tier: application, com.echo.version: "${VERSION:-latest}" }

  # ---------------------------------------------------------------------------
  # Message Service
  # ---------------------------------------------------------------------------
  message-service:
    <<: *service-base
    build:
      <<: *build-base
      dockerfile: services/message-service/Dockerfile
    # container_name removed - incompatible with deploy.replicas
    image: echo/message-service:${VERSION:-latest}
    expose: [ "8083", "8084" ]
    environment:
      <<: [ *env-full, *env-kafka ]
      SERVER_PORT: 8083
      WS_PORT: 8084
      REDIS_DB: 1
      REDIS_MAX_RETRIES: 3
      REDIS_POOL_SIZE: 10
      DB_CONN_MAX_LIFETIME: 300s
      KAFKA_TOPIC: messages
      KAFKA_NOTIFICATION_TOPIC: notifications
      KAFKA_CONSUMER_GROUP: message-service-prod
      KAFKA_SESSION_TIMEOUT: 10s
      KAFKA_HEARTBEAT_INTERVAL: 3s
      KAFKA_ENABLE_AUTO_COMMIT: "false"
      KAFKA_PARTITION_ASSIGNMENT_STRATEGY: range
      WS_READ_BUFFER_SIZE: 4096
      WS_WRITE_BUFFER_SIZE: 4096
      WS_MAX_MESSAGE_SIZE: 1048576
      WS_PING_INTERVAL: 30s
      WS_PONG_TIMEOUT: 60s
      WS_MAX_CONNECTIONS: 10000
    volumes:
      - message-service-logs:/var/log/message-service
      - ./certs/message:/app/certs:ro
    depends_on: *depends-full
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/health" ]
    deploy:
      <<: *deploy-standard
      replicas: 3
      resources: *resources-standard
    labels: { com.echo.service: message-service, com.echo.tier: application, com.echo.version: "${VERSION:-latest}", com.echo.critical: "true" }

  # ---------------------------------------------------------------------------
  # Location Service
  # ---------------------------------------------------------------------------
  location-service:
    profiles: ["full"]
    <<: *service-base
    build:
      <<: *build-base
      dockerfile: services/location-service/Dockerfile
    # container_name removed - incompatible with deploy.replicas
    image: echo/location-service:${VERSION:-latest}
    expose: [ "8090" ]
    logging: *logging-small
    environment:
      <<: [ *env-common, *env-performance-small ]
      HOST: 0.0.0.0
      PORT: 8090
    volumes:
      - location-service-logs:/var/log/location-service
      - ${PWD}/services/location-service/data:/app/data:ro
    healthcheck:
      <<: *healthcheck
      timeout: 3s
      start_period: 10s
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health" ]
    deploy:
      <<: *deploy-standard
      resources: *resources-small
    labels: { com.echo.service: location-service, com.echo.tier: application, com.echo.version: "${VERSION:-latest}" }

  # ---------------------------------------------------------------------------
  # Media Service
  # ---------------------------------------------------------------------------
  media-service:
    profiles: ["full"]
    <<: *service-base
    build:
      <<: *build-base
      dockerfile: services/media-service/Dockerfile
    # container_name removed - incompatible with deploy.replicas
    image: echo/media-service:${VERSION:-latest}
    expose: [ "8085" ]
    environment:
      <<: *env-full
      SERVER_PORT: 8085
      CONFIG_PATH: /app/configs/config.yaml
      REDIS_DB: 3
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      STORAGE_PATH: /app/media
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MAX_FILE_SIZE: 52428800
      ALLOWED_MIME_TYPES: image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,audio/mpeg,audio/wav
      FEATURE_DEDUPLICATION_ENABLED: "true"
      FEATURE_COMPRESSION_ENABLED: "true"
      FEATURE_VIRUS_SCAN_ENABLED: ${VIRUS_SCAN_ENABLED:-false}
    volumes:
      - media-service-logs:/var/log/media-service
      - media-storage:/app/media
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/health" ]
    deploy:
      <<: *deploy-standard
      resources: *resources-standard
    labels: { com.echo.service: media-service, com.echo.tier: application, com.echo.version: "${VERSION:-latest}" }

  # ---------------------------------------------------------------------------
  # Presence Service
  # ---------------------------------------------------------------------------
  presence-service:
    profiles: ["full"]
    <<: *service-base
    build:
      <<: *build-base
      dockerfile: services/presence-service/Dockerfile
    # container_name removed - incompatible with deploy.replicas
    image: echo/presence-service:${VERSION:-latest}
    expose: [ "8084" ]
    environment:
      <<: [ *env-common, *env-performance-small, *env-db, *env-redis ]
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8084
      CONFIG_PATH: /app/configs/config.yaml
      REDIS_DB: 4
      PRESENCE_UPDATE_INTERVAL: 30s
      PRESENCE_TIMEOUT: 300s
      PRESENCE_CLEANUP_INTERVAL: 60s
    volumes:
      - presence-service-logs:/var/log/presence-service
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/health" ]
    deploy:
      <<: *deploy-standard
      resources: *resources-small
    labels: { com.echo.service: presence-service, com.echo.tier: application, com.echo.version: "${VERSION:-latest}" }

  # ---------------------------------------------------------------------------
  # WebSocket Service
  # ---------------------------------------------------------------------------
  ws-service:
    <<: *service-base
    build:
      <<: *build-base
      dockerfile: services/ws-service/Dockerfile
    image: echo/ws-service:${VERSION:-latest}
    expose: [ "8086" ]
    environment:
      <<: [ *env-full, *env-kafka ]
      SERVER_PORT: 8086
      CONFIG_PATH: /app/configs/config.yaml
      REDIS_DB: 5
      REDIS_POOL_SIZE: 20
      KAFKA_TOPIC: chat-messages
      KAFKA_CLIENT_ID: ws-service
      KAFKA_GROUP_ID: ws-delivery-group
      WS_WRITE_WAIT: 10s
      WS_PONG_WAIT: 60s
      WS_PING_PERIOD: 54s
      WS_MAX_MESSAGE_SIZE: 10485760
      WS_CLIENT_BUFFER_SIZE: 256
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS}
    depends_on: *depends-full
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/health" ]
    deploy:
      <<: *deploy-standard
      replicas: 3
      resources: *resources-standard
    labels: { com.echo.service: ws-service, com.echo.tier: application, com.echo.version: "${VERSION:-latest}", com.echo.critical: "true" }
