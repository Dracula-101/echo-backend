# e2-small overlay — applied AFTER docker-compose.yml + docker-compose.prod.yml.
# Usage:
#   docker compose \
#     -f infra/docker/docker-compose.yml \
#     -f infra/docker/docker-compose.prod.yml \
#     -f infra/docker/docker-compose.e2small.yml \
#     --env-file .env up -d --build \
#     postgres redis zookeeper kafka api-gateway auth-service user-service message-service ws-service
#
# Only the essential services are started. Stub services (media, presence,
# location, notification, analytics) are simply omitted from the `up` line.
#
# Tunings:
# - Kafka and Zookeeper heap dropped hard.
# - GOMEMLIMIT reduced on every Go service.
# - Resource reservations removed so docker doesn't fail to schedule.
name: echo-backend-prod

services:
  postgres:
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 350M }
        reservations: { cpus: '0.1', memory: 100M }
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements,pg_cron
        -c cron.database_name=${POSTGRES_DB:-echo_db}
        -c shared_buffers=64MB
        -c effective_cache_size=192MB
        -c work_mem=2MB
        -c maintenance_work_mem=16MB
        -c max_connections=50

  redis:
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 96M }
        reservations: { cpus: '0.05', memory: 32M }

  zookeeper:
    environment:
      KAFKA_HEAP_OPTS: "-Xmx96m -Xms64m"
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 200M }
        reservations: { cpus: '0.1', memory: 96M }

  kafka:
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms192m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:G1HeapRegionSize=8M"
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 384M }
        reservations: { cpus: '0.2', memory: 256M }

  api-gateway:
    environment:
      GOMEMLIMIT: 64MiB
      GOMAXPROCS: 1
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 96M }
        reservations: { cpus: '0.05', memory: 32M }

  auth-service:
    environment:
      GOMEMLIMIT: 64MiB
      GOMAXPROCS: 1
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 96M }
        reservations: { cpus: '0.05', memory: 32M }

  user-service:
    environment:
      GOMEMLIMIT: 64MiB
      GOMAXPROCS: 1
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 96M }
        reservations: { cpus: '0.05', memory: 32M }

  message-service:
    environment:
      GOMEMLIMIT: 96MiB
      GOMAXPROCS: 1
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.05', memory: 48M }

  ws-service:
    environment:
      GOMEMLIMIT: 96MiB
      GOMAXPROCS: 1
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.05', memory: 48M }
