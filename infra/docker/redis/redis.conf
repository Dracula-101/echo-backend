# Redis base configuration
# Sensitive settings (password, memory limits) are passed via command-line args in docker-compose.

bind 0.0.0.0
protected-mode yes
tcp-backlog 511
tcp-keepalive 300

appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

maxmemory-policy allkeys-lru
slowlog-log-slower-than 10000
slowlog-max-len 128
loglevel notice

# Keyspace notifications:
#   K = key-space events, x = expired-key events.
# ws-service subscribes to __keyevent@<db>__:expired for typing-key cleanup
# (P2.3 safety net for pod crashes that leave orphaned typing state).
notify-keyspace-events Kx
