# Redis base configuration
# Sensitive settings (password, memory limits) are passed via command-line args in docker-compose.

bind 0.0.0.0
protected-mode yes
tcp-backlog 511
tcp-keepalive 300

appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

maxmemory-policy allkeys-lru
slowlog-log-slower-than 10000
slowlog-max-len 128
loglevel notice
