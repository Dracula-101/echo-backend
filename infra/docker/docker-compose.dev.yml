# Echo Backend - Development Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: echo-backend-dev

# =============================================================================
# EXTENSION FIELDS (Shared Configuration)
# =============================================================================

# Environment Variable Groups
x-env-common: &env-common
  APP_ENV: development
  LOG_LEVEL: debug
  LOG_FORMAT: console
  ENABLE_HOT_RELOAD: "true"
  ENABLE_DEBUG: "true"
  GOMAXPROCS: 2
  GOGC: 100

x-env-db: &env-db
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-echo}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-echo_password}
  DB_NAME: ${POSTGRES_DB:-echo_db}
  DB_SSLMODE: disable

x-env-redis: &env-redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

x-env-kafka: &env-kafka
  KAFKA_BROKERS: kafka:29092
  # Shared producer settings
  KAFKA_COMPRESSION: snappy
  KAFKA_ACKS: all
  KAFKA_ENABLE_IDEMPOTENCE: "true"
  KAFKA_MAX_IN_FLIGHT: 5
  KAFKA_MAX_RETRIES: 5
  KAFKA_RETRY_BACKOFF: 100ms
  KAFKA_DIAL_TIMEOUT: 10s
  KAFKA_BATCH_SIZE: 16384
  KAFKA_LINGER_MS: 10
  # Shared consumer settings
  KAFKA_SESSION_TIMEOUT: 10s
  KAFKA_HEARTBEAT_INTERVAL: 3s

x-meiliseach: &env-meilisearch
  MEILI_HOST: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-echo_search_key}
  MEILI_INDEX_NAME: users
  MEILI_TIMEOUT: 5s

x-env-ws: &env-ws
  WS_READ_BUFFER_SIZE: 1024
  WS_WRITE_BUFFER_SIZE: 1024

# Full environment for standard services
x-env-full: &env-full
  <<: [ *env-common, *env-db, *env-redis ]
  SERVER_HOST: 0.0.0.0

# Base Service Template
x-service-base: &service-base
  env_file: [ "${PWD}/.env" ]
  networks: [ echo-network ]
  restart: unless-stopped
  stdin_open: true
  tty: true

# Shared volumes for Go services
x-go-volumes: &go-volumes
  - go-mod-cache:/go/pkg/mod
  - go-build-cache:/root/.cache/go-build

# Healthcheck Template
x-healthcheck: &healthcheck
  interval: 1m
  timeout: 3s
  retries: 3
  start_period: 40s

# Dependency Templates
x-depends-db: &depends-db
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }

x-depends-full: &depends-full
  <<: *depends-db
  kafka: { condition: service_healthy }

# =============================================================================
# NETWORKS & VOLUMES
# =============================================================================
networks:
  echo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  go-mod-cache:
  go-build-cache:
  api-gateway-cache:
  auth-service-cache:
  message-service-cache:
  user-service-cache:
  location-service-cache:
  media-service-cache:
  presence-service-cache:
  ws-service-cache:

    # =============================================================================
    # SERVICES
    # =============================================================================
services:

  # ---------------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------------
  go-cache-warmer:
    image: golang:1.21-alpine
    container_name: echo-go-cache-warmer
    profiles: [ "cache-warmer" ]
    working_dir: /workspace
    networks: [ echo-network ]
    restart: "no"
    volumes:
      - ${PWD}:/workspace:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: |
      sh -c 'apk add --no-cache git
      for svc in shared api-gateway auth-service message-service user-service location-service media-service presence-service ws-service; do
        for dir in /workspace/services/$$svc /workspace/$$svc; do
          [ -f "$$dir/go.mod" ] && cd "$$dir" && go mod download && echo "✓ $$svc"
        done
      done
      echo "✅ Cache ready"'

  db-init:
    image: postgres:15-alpine
    container_name: echo-db-init
    networks: [ echo-network ]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-echo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-echo_password}
      PGDATABASE: ${POSTGRES_DB:-echo_db}
    volumes:
      - ${PWD}/infra/scripts:/scripts:ro
      - ${PWD}/database:/database:ro
    command: |
      sh -c '
        echo "⏳ Waiting for postgres..."
        until pg_isready -h postgres -U $${PGUSER}; do sleep 1; done
        echo "✅ Postgres ready"
        
        # Run init script if exists
        if [ -f /scripts/init-db.sh ]; then
          echo "📜 Running init-db.sh..."
          apk add --no-cache bash >/dev/null 2>&1
          bash /scripts/init-db.sh
        fi
        
        # Run all SQL files in /database/migrations (sorted)
        if [ -d /database/migrations ]; then
          echo "📦 Running migrations..."
          for f in $$(ls /database/migrations/*.sql 2>/dev/null | sort); do
            echo "  → $$f"
            psql -f "$$f" || echo "  ⚠️ Failed: $$f"
          done
        fi
        
        # Run all SQL files in /database/schemas (sorted)
        if [ -d /database/schemas ]; then
          echo "📦 Running schemas..."
          for f in $$(ls /database/schemas/*.sql 2>/dev/null | sort); do
            echo "  → $$f"
            psql -f "$$f" || echo "  ⚠️ Failed: $$f"
          done
        fi
        
        # Run seed data if exists
        if [ -f /database/seed.sql ]; then
          echo "🌱 Running seed data..."
          psql -f /database/seed.sql
        fi
        
        echo "✅ Database initialization complete"
      '

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    ports: [ "5432:5432" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echo_password}
      POSTGRES_DB: ${POSTGRES_DB:-echo_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_HOST_AUTH_METHOD: md5
    command: >
      postgres
        -c pg_cron.database=${POSTGRES_DB:-echo_db}
        -c pg_stat_statements.track=all
        -c log_statement=all
        -c log_duration=on
        -c log_min_duration_statement=100

  redis:
    ports: [ "6379:6379" ]
    command: |
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD:-redis_password}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --loglevel debug

  zookeeper:
    ports: [ "2181:2181" ]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "*"

  kafka:
    ports: [ "9092:9092", "9093:9093" ]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 30000
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 30000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ---------------------------------------------------------------------------
  # API Gateway (Public)
  # ---------------------------------------------------------------------------
  api-gateway:
    <<: *service-base
    build: { context: "${PWD}", dockerfile: services/api-gateway/Dockerfile.dev }
    container_name: echo-api-gateway-dev
    image: echo/api-gateway:dev
    ports: [ "8080:8080", "2345:2345" ]
    environment:
      <<: *env-full
      SERVER_PORT: 8080
      CONFIG_PATH: /app/services/api-gateway/configs/config.yaml
      ENABLE_PROFILING: "true"
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      MESSAGE_SERVICE_URL: http://message-service:8083
      MEDIA_SERVICE_URL: http://media-service:8085
      PRESENCE_SERVICE_URL: http://presence-service:8086
      LOCATION_SERVICE_URL: http://location-service:8090
    volumes:
      - ${PWD}/services/api-gateway:/app/services/api-gateway
      - ${PWD}/shared:/app/shared:ro
      - api-gateway-cache:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      <<: *depends-full
      auth-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
      message-service: { condition: service_healthy }
      media-service: { condition: service_healthy }
      presence-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/v1/health" ]
    labels: { com.echo.service: api-gateway, com.echo.mode: development }

  # ---------------------------------------------------------------------------
  # Auth Service
  # ---------------------------------------------------------------------------
  auth-service:
    <<: *service-base
    build: { context: "${PWD}", dockerfile: services/auth-service/Dockerfile.dev }
    container_name: echo-auth-service-dev
    image: echo/auth-service:dev
    expose: [ "8081" ]
    environment:
      <<: [ *env-full, *env-kafka ]
      SERVER_PORT: 8081
      CONFIG_PATH: /app/services/auth-service/configs/config.yaml
      REDIS_DB: 0
      DB_MAX_OPEN_CONNS: 10
      DB_MAX_IDLE_CONNS: 5
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_change_in_production}
      JWT_EXPIRY: 24h
      REFRESH_TOKEN_EXPIRY: 168h
      LOCATION_SERVICE_ENDPOINT: http://location-service:8090/lookup
      # Kafka producer (auth-events)
      KAFKA_CLIENT_ID: auth-service
      KAFKA_TOPIC: auth-events
    volumes:
      - ${PWD}/services/auth-service:/app/services/auth-service
      - ${PWD}/shared:/app/shared:ro
      - auth-service-cache:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on: *depends-full
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
    labels: { com.echo.service: auth-service, com.echo.mode: development }

  # ---------------------------------------------------------------------------
  # User Service
  # ---------------------------------------------------------------------------
  user-service:
    <<: *service-base
    build: { context: "${PWD}", dockerfile: services/user-service/Dockerfile.dev }
    container_name: echo-user-service-dev
    image: echo/user-service:dev
    expose: [ "8082" ]
    environment:
      <<: [ *env-full, *env-kafka, *env-meilisearch ]
      SERVER_PORT: 8082
      CONFIG_PATH: /app/services/user-service/configs/config.yaml
      REDIS_DB: 2
      LOCATION_SERVICE_ENDPOINT: http://location-service:8090/lookup
      # Kafka consumer (media-events)
      KAFKA_CLIENT_ID: user-service
      KAFKA_TOPIC: media-events
      KAFKA_GROUP_ID: user-service-consumer-group
      # Meilisearch configuration
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-echo_search_key}
      MEILI_INDEX_NAME: users
      MEILI_TIMEOUT: 5s
    volumes:
      - ${PWD}/services/user-service:/app/services/user-service
      - ${PWD}/shared:/app/shared:ro
      - user-service-cache:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on: *depends-full
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8082/health" ]
    labels: { com.echo.service: user-service, com.echo.mode: development }

  # ---------------------------------------------------------------------------
  # Message Service
  # ---------------------------------------------------------------------------
  message-service:
    <<: *service-base
    build: { context: "${PWD}", dockerfile: services/message-service/Dockerfile.dev }
    container_name: echo-message-service-dev
    image: echo/message-service:dev
    expose: [ "8083" ]
    environment:
      <<: [ *env-full, *env-kafka ]
      SERVER_PORT: 8083
      CONFIG_PATH: /app/services/message-service/configs/config.yaml
      REDIS_DB: 1
      # Kafka producer + consumers
      KAFKA_PRODUCER_CLIENT_ID: message-service-producer
      KAFKA_TOPIC: chat-messages
      KAFKA_CONSUMER_CLIENT_ID: message-service-consumer
      KAFKA_GROUP_ID: message-service-consumer-group
      KAFKA_DELIVERY_CLIENT_ID: message-service-delivery-consumer
      KAFKA_DELIVERY_TOPIC: delivery-events
      KAFKA_DELIVERY_GROUP_ID: message-service-delivery-group
    volumes:
      - ${PWD}/services/message-service:/app/services/message-service
      - ${PWD}/shared:/app/shared:ro
      - message-service-cache:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on: *depends-full
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8083/health" ]
    labels: { com.echo.service: message-service, com.echo.mode: development }

  # ---------------------------------------------------------------------------
  # Location Service
  # ---------------------------------------------------------------------------
  location-service:
    <<: *service-base
    build: { context: "${PWD}", dockerfile: services/location-service/Dockerfile.dev }
    container_name: echo-location-service-dev
    image: echo/location-service:dev
    expose: [ "8090" ]
    environment:
      <<: [ *env-common, *env-db ]
      HOST: 0.0.0.0
      PORT: 8090
    volumes:
      - ${PWD}/services/location-service:/app/services/location-service
      - ${PWD}/shared:/app/shared:ro
      - ${PWD}/services/location-service/data:/app/data:ro
      - location-service-cache:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8090/health" ]
      start_period: 20s
    labels: { com.echo.service: location-service, com.echo.mode: development }

  # ---------------------------------------------------------------------------
  # Presence Service
  # ---------------------------------------------------------------------------
  presence-service:
    <<: *service-base
    build: { context: "${PWD}", dockerfile: services/presence-service/Dockerfile.dev }
    container_name: echo-presence-service-dev
    image: echo/presence-service:dev
    expose: [ "8084" ]
    environment:
      <<: *env-full
      SERVER_PORT: 8084
      CONFIG_PATH: /app/services/presence-service/configs/config.yaml
      REDIS_DB: 4
      PRESENCE_UPDATE_INTERVAL: 30s
      PRESENCE_TIMEOUT: 300s
      PRESENCE_CLEANUP_INTERVAL: 60s
    volumes:
      - ${PWD}/services/presence-service:/app/services/presence-service
      - ${PWD}/shared:/app/shared:ro
      - presence-service-cache:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on: *depends-db
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8084/health" ]
    labels: { com.echo.service: presence-service, com.echo.mode: development }

  # ---------------------------------------------------------------------------
  # Media Service
  # ---------------------------------------------------------------------------
  media-service:
    <<: *service-base
    build: { context: "${PWD}", dockerfile: services/media-service/Dockerfile.dev }
    container_name: echo-media-service-dev
    image: echo/media-service:dev
    expose: [ "8085" ]
    environment:
      <<: [ *env-full, *env-kafka ]
      SERVER_PORT: 8085
      CONFIG_PATH: /app/services/media-service/configs/config.yaml
      REDIS_DB: 3
      STORAGE_TYPE: local
      STORAGE_PATH: /app/media
      MAX_FILE_SIZE: 10485760
      ALLOWED_MIME_TYPES: image/jpeg,image/png,image/gif,video/mp4,audio/mpeg
      FEATURE_DEDUPLICATION_ENABLED: "true"
      FEATURE_COMPRESSION_ENABLED: "true"
      # Kafka producer (media-events)
      KAFKA_CLIENT_ID: media-service
      KAFKA_TOPIC: media-events
    volumes:
      - ${PWD}/services/media-service:/app/services/media-service
      - ${PWD}/shared:/app/shared:ro
      - ${PWD}/data/media:/app/media
      - media-service-cache:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on: *depends-full
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8085/health" ]
    labels: { com.echo.service: media-service, com.echo.mode: development }

  # ---------------------------------------------------------------------------
  # WebSocket Service
  # ---------------------------------------------------------------------------
  ws-service:
    <<: *service-base
    build: { context: "${PWD}", dockerfile: services/ws-service/Dockerfile.dev }
    container_name: echo-ws-service-dev
    image: echo/ws-service:dev
    ports: [ "8086:8086" ]
    environment:
      <<: [ *env-full, *env-kafka, *env-ws ]
      SERVER_PORT: 8086
      CONFIG_PATH: /app/services/ws-service/configs/config.yaml
      REDIS_DB: 5
      WS_WRITE_WAIT: 10s
      WS_PONG_WAIT: 60s
      WS_PING_PERIOD: 54s
      WS_MAX_MESSAGE_SIZE: 10485760
      WS_CLIENT_BUFFER_SIZE: 256
      # Kafka producer + consumer (chat-messages)
      KAFKA_PRODUCER_CLIENT_ID: ws-service-producer
      KAFKA_CONSUMER_CLIENT_ID: ws-service
      KAFKA_TOPIC: chat-messages
      KAFKA_GROUP_ID: ws-service-delivery-group
    volumes:
      - ${PWD}/services/ws-service:/app/services/ws-service
      - ${PWD}/shared:/app/shared:ro
      - ws-service-cache:/app/tmp
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on: *depends-full
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8086/health" ]
    labels: { com.echo.service: ws-service, com.echo.mode: development }
