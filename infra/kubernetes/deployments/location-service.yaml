apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service
  namespace: echo-backend
  labels:
    app: location-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: location-service
  template:
    metadata:
      labels:
        app: location-service
        version: v1
    spec:
      containers:
      - name: location-service
        image: gcr.io/PROJECT_ID/echo-location-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP
        env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: echo-config
              key: ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: echo-config
              key: LOG_LEVEL
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8090"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: location-service
  namespace: echo-backend
  labels:
    app: location-service
spec:
  type: ClusterIP
  selector:
    app: location-service
  ports:
  - name: http
    port: 8090
    targetPort: 8090
    protocol: TCP
